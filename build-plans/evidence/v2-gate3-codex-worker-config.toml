[mcp_servers.intelizen-worker]
command = "/Users/adamking/.local/bin/node"
args = [
  "/Users/adamking/projects/intellizen-app/mcp-server/dist/index.js",
  "--plane",
  "worker",
]
env_vars = [
  "INTELLIZEN_WORKER_CAPABILITY_URL",
  "INTELLIZEN_WORKER_CAPABILITY_TOKEN",
]
default_tools_approval_mode = "approve"
enabled_tools = [
  "advance_workflow_step",
  "append_agent_work_note",
  "list_agent_projects",
  "list_agent_work",
  "list_databases",
  "list_role_assignments",
  "list_roles",
  "list_workflow_runs",
  "list_workflows",
  "query_records",
  "report_verification",
]
